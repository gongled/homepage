    - "Сократил TCO на ИТ на 35% за 2025–2026 год."
    - "Поднял соответствие корпоративным стандартам архитектуры с 70% до 92%."
    - "Провёл реинжиниринг корзины: TCO снизился в 10 раз, latency — в 4 раза до 200 мс, ёмкость выросла с 10 до 100 rps."
    - "Подготовил компанию к высокому сезону: за полгода увеличил производительность в 2,2 раза при доступности 99,9%."
