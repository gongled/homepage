    - title: "Архитектура и платформы"
      items: "Enterprise Architecture, Solution Architecture, System Design, сервис-ориентированная архитектура (SoA), микросервисная архитектура (MSA), модульная монолитная архитектура, event-driven architecture, API-first, C4 Model, ADR, технологический радар, CMDB, platform engineering, Kubernetes, облака (Cloud.ru, Yandex.Cloud), IaaS, IaC."
